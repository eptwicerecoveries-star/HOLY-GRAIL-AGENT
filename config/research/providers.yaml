# Phase 6B research provider registry.
# County-specific provider choice belongs in config/counties/<state>/<slug>.yaml under
# an optional `research.property_provider` key — never in application if/elif branches.
#
# Phase 6B ships only non-network providers. Live Socrata/ArcGIS/REST adapters are later.
# Omitted `reliability` on a custom config file keeps conservative defaults
# (cache TTL 0, max_attempts 1, unlimited rate limit).

schema_version: 1
default_property_provider: manual_lookup

reliability:
  cache:
    ttl_seconds: 86400
  retry:
    max_attempts: 3
    backoff_seconds: 0.5
  rate_limit:
    per_second: 0

providers:
  manual_lookup:
    type: manual
    description: >-
      No automated official source configured. Records not_found and requires
      human research. Never fabricates a successful result.

  "null":
    type: "null"
    description: >-
      Explicitly disabled / missing provider. Never treated as a successful
      research result.

  # Example shape for a future live provider. Resolving this name without the
  # env var set yields credentials_missing (error), never success. Phase 6B
  # does not perform HTTP calls even when the env var is present.
  example_open_data:
    type: credentials_required
    requires_credential: SURPLUS_AI_RESEARCH_EXAMPLE_API_KEY
    description: >-
      Placeholder for a future official open-data adapter. Missing credentials
      are an error outcome; credentials are never written into research payloads.
