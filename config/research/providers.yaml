# Phase 6D research provider registry.
# County-specific provider choice belongs in config/counties/<state>/<slug>.yaml under
# an optional `research.property_provider` key — never in application if/elif branches.
#
# Live Socrata adapters exist but must not be selected for a county until a real official
# dataset is separately approved. verified_for_automated_access is an internal operational
# gate only; it is not legal permission to automate access. nyc_dcp_pluto is a disabled
# candidate only: listable, unverified, and not selected by any county. example_arcgis is
# a disabled fake FeatureServer shape only; no official ArcGIS dataset is configured.
# Omitted `reliability` on a custom config file keeps conservative defaults
# (cache TTL 0, max_attempts 1, unlimited rate limit).

schema_version: 1
default_property_provider: manual_lookup

reliability:
  cache:
    ttl_seconds: 86400
  retry:
    max_attempts: 3
    backoff_seconds: 0.5
  rate_limit:
    per_second: 0

providers:
  manual_lookup:
    type: manual
    description: >-
      No automated official source configured. Records not_found and requires
      human research. Never fabricates a successful result.

  "null":
    type: "null"
    description: >-
      Explicitly disabled / missing provider. Never treated as a successful
      research result.

  # Example shape for a future live provider. Resolving this name without the
  # env var set yields credentials_missing (error), never success. Phase 6B
  # does not perform HTTP calls even when the env var is present.
  example_open_data:
    type: credentials_required
    requires_credential: SURPLUS_AI_RESEARCH_EXAMPLE_API_KEY
    description: >-
      Placeholder for a future official open-data adapter. Missing credentials
      are an error outcome; credentials are never written into research payloads.

  # Example Socrata adapter shape. Not verified for automated access and not
  # selected by any county. Selecting it performs no HTTP.
  example_socrata:
    type: socrata
    description: >-
      Example Socrata open-data adapter. Not approved for automated access.
      No county is pointed at this provider.
    options:
      domain: opendata.example.gov
      dataset_id: abcd-1234
      parcel_field: parcel_id
      owner_field: owner_name
      account_field: account_id
      situs_address_field: situs_address
      mailing_address_field: mailing_address
      record_id_field: ":id"
      query_limit: 10
      source_organization: Example City Open Data
      verified_for_automated_access: false
      optional_credential: SURPLUS_AI_SOCRATA_EXAMPLE_APP_TOKEN

  # NYC DCP PLUTO on NYC Open Data. Candidate for a later controlled live request.
  # Not approved for automated access. Do not point a county at this provider.
  nyc_dcp_pluto:
    type: socrata
    description: >-
      NYC Department of City Planning PLUTO on NYC Open Data (64uk-42ks).
      Candidate for controlled Phase 6D live validation; not yet approved for automated access.
    reliability:
      cache:
        ttl_seconds: 0
      retry:
        max_attempts: 1
        backoff_seconds: 0
      rate_limit:
        per_second: 1
    options:
      domain: data.cityofnewyork.us
      dataset_id: 64uk-42ks
      parcel_field: bbl
      parcel_value_type: number
      owner_field: ownername
      situs_address_field: address
      select_fields:
        - bbl
        - ownername
        - address
      query_limit: 5
      source_organization: New York City Department of City Planning
      verified_for_automated_access: false

  # Example ArcGIS FeatureServer adapter shape. Not verified for automated access
  # and not selected by any county. Selecting it performs no HTTP.
  example_arcgis:
    type: arcgis
    description: >-
      Example ArcGIS FeatureServer adapter. Not approved for automated access.
      No county is pointed at this provider.
    options:
      domain: gis.example.gov
      service_path: /arcgis/rest/services/Example/Parcels/FeatureServer
      layer_id: 0
      parcel_field: PARCELID
      parcel_value_type: text
      owner_field: OWNER_NAME
      situs_address_field: SITEADDRESS
      record_id_field: OBJECTID
      select_fields:
        - PARCELID
        - OWNER_NAME
        - SITEADDRESS
        - OBJECTID
      query_limit: 5
      source_organization: Example County GIS
      verified_for_automated_access: false
