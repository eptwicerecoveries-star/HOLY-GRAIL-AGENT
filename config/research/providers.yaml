# Phase 6D research provider registry.
# County-specific provider choice belongs in config/counties/<state>/<slug>.yaml under
# an optional `research.property_provider` key — never in application if/elif branches.
#
# Live Socrata adapters exist but must not be selected for a county until a real official
# dataset is separately approved. verified_for_automated_access is an internal operational
# gate only; it is not legal permission to automate access.
# Omitted `reliability` on a custom config file keeps conservative defaults
# (cache TTL 0, max_attempts 1, unlimited rate limit).

schema_version: 1
default_property_provider: manual_lookup

reliability:
  cache:
    ttl_seconds: 86400
  retry:
    max_attempts: 3
    backoff_seconds: 0.5
  rate_limit:
    per_second: 0

providers:
  manual_lookup:
    type: manual
    description: >-
      No automated official source configured. Records not_found and requires
      human research. Never fabricates a successful result.

  "null":
    type: "null"
    description: >-
      Explicitly disabled / missing provider. Never treated as a successful
      research result.

  # Example shape for a future live provider. Resolving this name without the
  # env var set yields credentials_missing (error), never success. Phase 6B
  # does not perform HTTP calls even when the env var is present.
  example_open_data:
    type: credentials_required
    requires_credential: SURPLUS_AI_RESEARCH_EXAMPLE_API_KEY
    description: >-
      Placeholder for a future official open-data adapter. Missing credentials
      are an error outcome; credentials are never written into research payloads.

  # Example Socrata adapter shape. Not verified for automated access and not
  # selected by any county. Selecting it performs no HTTP.
  example_socrata:
    type: socrata
    description: >-
      Example Socrata open-data adapter. Not approved for automated access.
      No county is pointed at this provider.
    options:
      domain: opendata.example.gov
      dataset_id: abcd-1234
      parcel_field: parcel_id
      owner_field: owner_name
      account_field: account_id
      situs_address_field: situs_address
      mailing_address_field: mailing_address
      record_id_field: ":id"
      query_limit: 10
      source_organization: Example City Open Data
      verified_for_automated_access: false
      optional_credential: SURPLUS_AI_SOCRATA_EXAMPLE_APP_TOKEN
