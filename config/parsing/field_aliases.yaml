# Global alias registry: canonical field -> the column labels counties actually publish.
#
# Aliases are matched after normalization (casefold, punctuation stripped, "#" and "no."
# expanded to "number", whitespace collapsed), so "ACCT #", "Acct. No." and "account
# number" all reduce to the same key. Add new spellings here rather than in code; a label
# learned from one county then helps every county that follows.
#
# surplus_amount is deliberately NOT listed here. Its vocabulary lives in
# surplus_terms.yaml and is matched by exact rule only, never fuzzily.

