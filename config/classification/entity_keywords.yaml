# Suffixes that belong to a person's name and must not be read as anything else.
person_suffixes:
  - jr
  - sr
  - ii
  - iii
  - iv
  - v
  - md
  - phd
  - esq

# Which kinds of owner are worth pursuing. The brief says to remove companies and keep
# individuals; estates and trusts are a deliberate third answer rather than a rounding of
# one into the other.
#
# An estate is often the most valuable lead of all: the owner has died, the heirs are
# entitled to the money, and they are frequently unaware it exists. Discarding estates as
# "not an individual" would throw those away. A trust is similar -- there is a human
# trustee to contact. Both are pursued by default and both are flagged so a caller knows
# they are approaching a representative rather than the owner.
pursue:
  individual: true
  estate: true
  trust: true
  company: false
  government: false
  unknown: false
