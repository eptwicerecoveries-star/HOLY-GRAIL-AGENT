# Vocabulary for deciding what kind of party an owner name refers to.
#
# Matched against the name after normalization (casefold, punctuation stripped, whitespace
# collapsed), as whole words. Whole-word matching matters: "INC" must not fire on
# "VINCENT", and "CO" must not fire on "COOPER".
#
# Add wordings here rather than in code. A suffix learned from one county then helps every
# county that follows, which is the same mechanism the column aliases use.

company_markers:
  - llc
  - l l c
  - inc
  - incorporated
  - corp
  - corporation
  - co
  - company
  - ltd
  - limited
  - lp
