services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: surplus_ai
      POSTGRES_PASSWORD: surplus_ai_dev
      POSTGRES_DB: surplus_ai
    ports:
      - "5432:5432"
    volumes:
      - surplus_ai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surplus_ai -d surplus_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  surplus_ai_pgdata:
