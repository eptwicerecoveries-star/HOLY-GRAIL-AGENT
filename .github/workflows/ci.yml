name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: surplus_ai
          POSTGRES_PASSWORD: surplus_ai_dev
          POSTGRES_DB: surplus_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U surplus_ai -d surplus_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SURPLUS_AI_ENV: test
      SURPLUS_AI_DATABASE_URL: postgresql+psycopg://surplus_ai:surplus_ai_dev@localhost:5432/surplus_ai_test
      SURPLUS_AI_LOG_LEVEL: INFO
      SURPLUS_AI_LOG_DIR: logs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy surplus_ai

      - name: Run tests
        run: pytest
