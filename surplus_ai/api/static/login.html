<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holy Grail — Sign in</title>
    <link rel="stylesheet" href="/static/css/dashboard.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <p class="brand-kicker">Surplus recovery</p>
        <h1 id="login-title" class="brand-title login-title">Holy Grail</h1>
        <p class="login-subtitle">Local operator sign-in. Not internet-facing.</p>
        <form id="login-form" class="login-form" novalidate>
          <label class="login-label" for="email">Email</label>
          <input
            class="login-input"
            id="email"
            name="email"
            type="email"
            autocomplete="username"
            required
            maxlength="320"
          />
          <label class="login-label" for="password">Password</label>
          <input
            class="login-input"
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="128"
          />
          <p id="login-error" class="login-error" role="alert" hidden></p>
          <button class="login-submit" type="submit">Sign in</button>
        </form>
      </section>
    </main>
    <script type="module" src="/static/js/login.js"></script>
  </body>
</html>
