[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surplus-ai"
version = "0.1.0"
description = "AI-powered operating system for a surplus funds recovery business"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "typer>=0.15,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg[binary]>=3.1,<3.2",
    "structlog>=24.1,<25.0",
]

[project.scripts]
surplusai = "surplus_ai.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<0.5",
    "black>=24.4,<25.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<4.0",
]

[tool.setuptools.packages.find]
include = ["surplus_ai*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes these files; their formatting is not hand-maintained.
"surplus_ai/database/migrations/versions/*.py" = ["E501"]
# typer.Argument/Option in defaults is how Typer declares CLI parameters.
"surplus_ai/cli/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["tests/", "surplus_ai/database/migrations/"]

[[tool.mypy.overrides]]
module = "surplus_ai.database.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=surplus_ai --cov-report=term-missing"
